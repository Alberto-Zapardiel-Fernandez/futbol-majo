spring:
  application:
    name: majo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${DB_USERNAME:postgres.rxpjhphnstrdxatjvwgt}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true

server:
  port: 8080

football:
  api:
    key: ${FOOTBALL_API_KEY:}
    url: https://api.football-data.org/v4

logging:
  level:
    root: INFO
    com.futbol.majo: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: DEBUG

# ✅ NUEVO DÍA 4: Configuración de Swagger UI / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html         # URL donde se sirve la UI
    operations-sorter: alpha       # Endpoints ordenados alfabéticamente
    tags-sorter: alpha             # Tags ordenados alfabéticamente
    try-it-out-enabled: true       # "Try it out" activo por defecto
  api-docs:
    path: /v3/api-docs             # URL del JSON con la especificación OpenAPI